name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x RuqaiyaPro-113-GOD-FINAL-FIX-FOR-BOSS-RUBEL/gradlew

      - name: Build Debug APK
        run: ./RuqaiyaPro-113-GOD-FINAL-FIX-FOR-BOSS-RUBEL/gradlew assembleDebug --no-daemon
        working-directory: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RuqaiyaPro-113-GOD-APK
          path: '**/build/outputs/apk/debug/*.apk'
